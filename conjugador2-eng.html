<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Czech Verb Conjugator – Present Tense</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    .presente {
      font-size: 1.3em;
      font-weight: 600;
    }

    #contador p {
      margin: 2px 0;
      font-size: 0.9rem;
    }

    #pregunta {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    #result {
      margin-top: 4px;
      font-size: 0.95rem;
    }

    #result .incorrect {
      color: #ff00a8;
      font-weight: bold;
    }

    #result .correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 5px;
      font-size: 14px;
      width: 50%;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }

    @media (min-width: 700px) {
      .title {
        font-size: 1.4rem;
      }
      #pregunta {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

<div class="title">Czech Verb Conjugator – <span class="presente">Present Tense</span></div>

<div id="contador">
  <p><strong>Questions:</strong> 0 | <strong>Correct:</strong> 0 | <strong>Accuracy:</strong> 0%</p>
</div>

<div id="pregunta"></div>

<input id="answer" type="text" placeholder="Type the correct form…" autocomplete="off">
<button onclick="checkAnswer()">Check</button>
<button onclick="newQuestion()">Next</button>

<div id="result"></div>

<script>
let verbs = [];
let currentVerb = null;
let currentPerson = null;

let total = 0;
let correct = 0;

let waitingForNext = false;

const persons = [
  "já",
  "ty",
  "on, ona, ono, to",
  "my",
  "vy",
  "oni, ony"
];

fetch('verbs2.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    verbs = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("contador").innerHTML =
    `<p><strong>Questions:</strong> ${total} |
     <strong>Correct:</strong> ${correct} |
     <strong>Accuracy:</strong> ${percent}%</p>`;
}

function newQuestion() {
  if (!verbs.length) return;

  waitingForNext = false;

  currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
  currentPerson = persons[Math.floor(Math.random() * persons.length)];

  document.getElementById("pregunta").innerHTML =
    `Verb: <em>${currentVerb.Infinitiv}</em><br>
     Person: <strong>${currentPerson}</strong>`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim();
  const correctForm = currentVerb[currentPerson];

  total++;

  if (user.toLowerCase() === correctForm.toLowerCase()) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correct</span><br>
       Form: <strong>${correctForm}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrect</span><br>
       The correct form is: <strong>${correctForm}</strong>`;
  }

  updateCounter();
  waitingForNext = true;
}
</script>

</body>
</html>
