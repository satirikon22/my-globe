<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle</title>

<!-- Rubik font -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  #card-area img {
    width: 100vw;
    max-width: 700px;
    display: block;
    margin: 30px auto;
  }

  #question-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: 30px auto;
    padding: 20px;
    font-size: clamp(28px, 8vw, 40px);
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
  }

  #infinity-btn {
    font-size: clamp(70px, 15vw, 120px);
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<script>
let lastQuestion = "";

// HYBRID RANDOMNESS FUNCTION
function hybridRandom(question) {
  let sum = 0;

  // Unicode sum of characters
  for (let i = 0; i < question.length; i++) {
    sum += question.charCodeAt(i);
  }

  // Mix in question length
  sum += question.length * 13;

  // Mix in current time (milliseconds)
  sum += Date.now() % 100000;

  // Mix in Math.random() for chaos
  sum += Math.floor(Math.random() * 9999);

  // Reduce to tarot range 1–78
  return (sum % 78) + 1;
}

function showHybridCard(question) {
  const n = hybridRandom(question);
  const img = new Image();

  // Cache-buster
  img.src = `cards/${n}.png?cb=${Date.now()}`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);
  };
}

document.getElementById('infinity-btn').addEventListener('click', () => {
  const question = document.getElementById('question-box').value.trim();

  // Only draw a new card if the question is NEW and NOT empty
  if (question !== "" && question !== lastQuestion) {
    lastQuestion = question;
    showHybridCard(question);
  }
});
</script>

</body>
</html>
