<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle Diary</title>

<!-- Rubik font -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  #card-area img {
    width: 100vw;
    max-width: 700px;
    display: block;
    margin: 30px auto;
  }

  #question-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: 30px auto;
    padding: 20px;
    font-size: clamp(28px, 8vw, 40px);
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    font-family: 'Rubik', sans-serif;
  }

  #infinity-btn {
    font-size: clamp(70px, 15vw, 120px);
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
    font-family: 'Rubik', sans-serif;
  }

  /* ALWAYS VISIBLE DIARY BUTTON */
  #diary-btn {
    font-size: clamp(50px, 12vw, 80px);
    margin: 10px auto 30px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: #f5e6c8;
    text-shadow: 0 0 12px #c9a86a;
    transition: transform 0.2s;
    display: block;
    font-family: 'Rubik', sans-serif;
  }
  #diary-btn:hover {
    transform: scale(1.15);
  }

  /* NOTES FIELD */
  #notes-box {
    width: 95%;
    max-width: 700px;
    height: 8em;
    margin: 20px auto;
    padding: 15px;
    font-size: clamp(22px, 6vw, 30px);
    background: #1e1e1e;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    display: none;
    font-family: 'Rubik', sans-serif;
  }

  /* BOOK SAVE BUTTON (ONLY ICON) */
  #save-notes-btn {
    font-size: clamp(50px, 12vw, 80px);
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: #f5e6c8;
    text-shadow: 0 0 12px #c9a86a;
    display: none;
    font-family: 'Rubik', sans-serif;
  }

  /* DIARY PANEL */
  #diary-panel {
    display: none;
    background: #111;
    padding: 20px;
    text-align: left;
    max-width: 700px;
    margin: 0 auto;
    border-left: 2px solid #444;
    border-right: 2px solid #444;
    font-family: 'Rubik', sans-serif;
  }

  .entry {
    background: #1c1c1c;
    padding: 15px;
    margin: 15px 0;
    border: 1px solid #333;
    border-radius: 6px;
    font-family: 'Rubik', sans-serif;
  }

  #back-btn {
    font-size: 30px;
    margin: 20px auto;
    display: block;
    background: none;
    border: 1px solid #555;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<!-- ALWAYS VISIBLE DIARY BUTTON -->
<button id="diary-btn">📖</button>

<div id="card-area"></div>

<!-- NOTES FIELD BELOW CARD -->
<textarea id="notes-box" placeholder="Write your notes here..."></textarea>

<!-- SAVE NOTES BUTTON BELOW NOTES (ONLY ICON) -->
<button id="save-notes-btn">📖</button>

<!-- DIARY PANEL -->
<div id="diary-panel"></div>

<script>
let lastQuestion = "";
let lastCard = null;

/* HYBRID RANDOMNESS */
function hybridRandom(question) {
  let sum = 0;

  for (let i = 0; i < question.length; i++) {
    sum += question.charCodeAt(i);
  }

  sum += question.length * 13;
  sum += Date.now() % 100000;
  sum += Math.floor(Math.random() * 9999);

  return (sum % 78) + 1;
}

/* SAVE DIARY ENTRY */
function saveDiaryEntry(question, cardNumber, notes) {
  const entry = {
    question: question,
    card: cardNumber,
    notes: notes,
    date: new Date().toLocaleString()
  };

  let diary = JSON.parse(localStorage.getItem("tarotDiary") || "[]");
  diary.push(entry);
  localStorage.setItem("tarotDiary", JSON.stringify(diary));
}

/* SHOW CARD */
function showHybridCard(question) {
  const n = hybridRandom(question);
  lastCard = n;

  const img = new Image();
  img.src = `cards/${n}.png?cb=${Date.now()}`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);

    // Show notes field and save button BELOW the card
    document.getElementById('notes-box').style.display = "block";
    document.getElementById('save-notes-btn').style.display = "block";
  };
}

/* DRAW CARD ONLY IF QUESTION IS NEW */
document.getElementById('infinity-btn').addEventListener('click', () => {
  const question = document.getElementById('question-box').value.trim();

  if (question !== "" && question !== lastQuestion) {
    lastQuestion = question;
    showHybridCard(question);
  }
});

/* SAVE NOTES */
document.getElementById('save-notes-btn').addEventListener('click', () => {
  const notes = document.getElementById('notes-box').value.trim();
  if (lastQuestion && lastCard) {
    saveDiaryEntry(lastQuestion, lastCard, notes);
    alert("Saved to diary.");
  }
});

/* SHOW DIARY */
document.getElementById('diary-btn').addEventListener('click', () => {
  let diary = JSON.parse(localStorage.getItem("tarotDiary") || "[]");
  let html = "<h2>Your Tarot Diary</h2>";

  diary.forEach(entry => {
    html += `
      <div class="entry">
        <p><strong>Question:</strong> ${entry.question}</p>
        <p><strong>Card:</strong> ${entry.card}</p>
        <p><strong>Date:</strong> ${entry.date}</p>
        <p><strong>Notes:</strong><br>${entry.notes}</p>
      </div>
    `;
  });

  html += `<button id="back-btn">Back</button>`;

  document.getElementById('diary-panel').innerHTML = html;
  document.getElementById('diary-panel').style.display = "block";
  document.getElementById('card-area').style.display = "none";
  document.getElementById('notes-box').style.display = "none";
  document.getElementById('save-notes-btn').style.display = "none";
});

/* BACK BUTTON */
document.addEventListener('click', (e) => {
  if (e.target.id === "back-btn") {
    document.getElementById('diary-panel').style.display = "none";
    document.getElementById('card-area').style.display = "block";
    document.getElementById('notes-box').style.display = "block";
    document.getElementById('save-notes-btn').style.display = "block";
  }
});
</script>

</body>
</html>
