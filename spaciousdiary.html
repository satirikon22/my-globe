<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  #card-area img {
    width: 100vw;
    max-width: 700px;
    display: block;
    margin: 30px auto;
  }

  .rubik-field, .diary-text {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: 30px auto;
    padding: 20px;
    font-size: clamp(28px, 8vw, 40px);
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    font-family: 'Rubik', sans-serif;
  }

  #infinity-btn {
    font-size: clamp(70px, 15vw, 120px);
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
  }

  #save-notes-btn,
  #torii-btn {
    font-size: clamp(40px, 10vw, 50px);
    background: none;
    border: none;
    color: #f5e6c8;
    text-shadow: 0 0 12px #c9a86a;
    cursor: pointer;
    margin: 20px auto;
    display: block;
  }

  #diary-panel {
    display: none;
    background: #111;
    padding: 20px;
    max-width: 700px;
    margin: 40px auto;
    border-left: 2px solid #444;
    border-right: 2px solid #444;
    text-align: left;
  }

  .entry {
    background: #1c1c1c;
    padding: 15px;
    margin: 15px 0;
    border: 1px solid #333;
    border-radius: 6px;
  }

  .mini-card {
    width: 120px;
    border-radius: 6px;
    display: block;
    margin: 10px 0;
  }
</style>
</head>

<body>

<input id="question-box" class="rubik-field" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<button id="torii-btn">⛩️</button>

<div id="diary-panel">
  <div id="diary-entries"></div>
</div>

<script>
let lastQuestion = "";
let lastCard = null;

function hybridRandom(question) {
  let sum = 0;
  for (let i = 0; i < question.length; i++) sum += question.charCodeAt(i);
  sum += question.length * 13;
  sum += Date.now() % 100000;
  sum += Math.floor(Math.random() * 9999);
  return (sum % 78) + 1;
}

function formatDayOnly() {
  const d = new Date();
  const day = d.getDate();
  const month = d.getMonth() + 1;
  const year = d.getFullYear();
  return `${day}. ${month}. ${year}`;
}

function saveDiaryEntry(question, cardNumber, notes) {
  const entry = {
    question,
    card: cardNumber,
    notes,
    date: formatDayOnly()   // day only, no time
  };
  let diary = JSON.parse(localStorage.getItem("oracleDiary") || "[]");
  diary.push(entry);
  localStorage.setItem("oracleDiary", JSON.stringify(diary));
}

function renderDiary() {
  let diary = JSON.parse(localStorage.getItem("oracleDiary") || "[]");
  const box = document.getElementById('diary-entries');
  box.innerHTML = "";

  diary.forEach(e => {
    const div = document.createElement('div');
    div.className = "entry diary-text";

    div.innerHTML = `
      ${e.question}<br>
      <img class="mini-card" src="cards/${e.card}.png">
      ${e.date}<br>
      ${e.notes}
    `;

    box.appendChild(div);
  });
}

function showHybridCard(question) {
  const n = hybridRandom(question);
  lastCard = n;

  const img = new Image();
  img.src = `cards/${n}.png?cb=${Date.now()}`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = "";
    area.appendChild(img);

    let notes = document.getElementById('notes-box');
    if (!notes) {
      notes = document.createElement('textarea');
      notes.id = 'notes-box';
      notes.className = 'rubik-field';
      notes.placeholder = 'Write your notes here...';
      area.appendChild(notes);
    }

    let saveBtn = document.getElementById('save-notes-btn');
    if (!saveBtn) {
      saveBtn = document.createElement('button');
      saveBtn.id = 'save-notes-btn';
      saveBtn.textContent = '📖';
      area.appendChild(saveBtn);

      saveBtn.addEventListener('click', () => {
        const notesText = notes.value.trim();
        if (lastQuestion && lastCard) {
          saveDiaryEntry(lastQuestion, lastCard, notesText);
          alert("Saved.");
        }
      });
    }
  };
}

document.getElementById('infinity-btn').addEventListener('click', () => {
  const question = document.getElementById('question-box').value.trim();
  if (question !== "" && question !== lastQuestion) {
    lastQuestion = question;
    showHybridCard(question);
  }
});

document.getElementById('torii-btn').addEventListener('click', () => {
  renderDiary();
  document.getElementById('diary-panel').style.display = "block";
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});
</script>

</body>
</html>
