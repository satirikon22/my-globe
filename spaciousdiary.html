<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  #card-area img {
    width: 100vw;
    max-width: 700px;
    display: block;
    margin: 30px auto;
  }

  #question-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: 30px auto;
    padding: 20px;
    font-size: clamp(28px, 8vw, 40px);
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
  }

  #infinity-btn {
    font-size: clamp(70px, 15vw, 120px);
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
  }

  #notes-box {
    width: 95%;
    max-width: 700px;
    height: 8em;
    margin: 20px auto;
    padding: 15px;
    font-size: clamp(22px, 6vw, 30px);
    background: #1e1e1e;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
  }

  #save-notes-btn {
    font-size: clamp(50px, 12vw, 80px);
    background: none;
    border: none;
    color: #f5e6c8;
    text-shadow: 0 0 12px #c9a86a;
    cursor: pointer;
    margin: 20px auto;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<script>
let lastQuestion = "";

// HYBRID RANDOMNESS FUNCTION
function hybridRandom(question) {
  let sum = 0;
  for (let i = 0; i < question.length; i++) {
    sum += question.charCodeAt(i);
  }
  sum += question.length * 13;
  sum += Date.now() % 100000;
  sum += Math.floor(Math.random() * 9999);
  return (sum % 78) + 1;
}

function showHybridCard(question) {
  const n = hybridRandom(question);
  const img = new Image();
  img.src = `cards/${n}.png?cb=${Date.now()}`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);

    // create notes field if not exists
    let notes = document.getElementById('notes-box');
    if (!notes) {
      notes = document.createElement('textarea');
      notes.id = 'notes-box';
      notes.placeholder = 'Write your notes here...';
      area.appendChild(notes);
    }

    // create book button if not exists
    let saveBtn = document.getElementById('save-notes-btn');
    if (!saveBtn) {
      saveBtn = document.createElement('button');
      saveBtn.id = 'save-notes-btn';
      saveBtn.textContent = '📖';
      area.appendChild(saveBtn);
    }
  };
}

document.getElementById('infinity-btn').addEventListener('click', () => {
  const question = document.getElementById('question-box').value.trim();
  if (question !== "" && question !== lastQuestion) {
    lastQuestion = question;
    showHybridCard(question);
  }
});
</script>

</body>
</html>
