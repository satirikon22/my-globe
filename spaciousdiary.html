<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle Diary</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background:black;
    color:white;
    font-family:'Rubik',sans-serif;
    text-align:center;
    margin:0;
    padding:0;
  }

  #question-box{
    width:95%;
    max-width:700px;
    margin:40px auto 20px auto;
    padding:20px;
    font-size:clamp(28px,8vw,40px);
    background:#222;
    border:1px solid #555;
    border-radius:8px;
    color:white;
  }

  #infinity-btn{
    font-size:clamp(70px,15vw,120px);
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    margin-bottom:40px;
  }

  #card-area img{
    width:100vw;
    max-width:700px;
    margin:30px auto;
    display:block;
  }

  #notes-box{
    width:95%;
    max-width:700px;
    height:8em;
    margin:20px auto;
    padding:15px;
    font-size:clamp(22px,6vw,30px);
    background:#1e1e1e;
    border:1px solid #555;
    border-radius:8px;
    color:white;
    display:none;
  }

  #save-notes-btn{
    font-size:clamp(50px,12vw,80px);
    background:none;
    border:none;
    color:#f5e6c8;
    text-shadow:0 0 12px #c9a86a;
    cursor:pointer;
    margin:20px auto;
    display:none;
  }

  #diary-panel{
    display:none;
    background:#111;
    padding:20px;
    max-width:700px;
    margin:40px auto;
    border-left:2px solid #444;
    border-right:2px solid #444;
    text-align:left;
  }

  .entry{
    background:#1c1c1c;
    padding:15px;
    margin:15px 0;
    border:1px solid #333;
    border-radius:6px;
  }

  #diary-btn{
    font-size:clamp(50px,12vw,80px);
    background:none;
    border:none;
    color:#f5e6c8;
    text-shadow:0 0 12px #c9a86a;
    cursor:pointer;
    margin:40px auto;
    display:block;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<textarea id="notes-box" placeholder="Write your notes here..."></textarea>
<button id="save-notes-btn">📖</button>

<button id="diary-btn">📖</button>

<div id="diary-panel">
  <h2>Your Tarot Diary</h2>
  <div id="diary-entries"></div>
</div>

<script>
let lastQuestion="";
let lastCard=null;

function hybridRandom(q){
  let s=0;
  for(let i=0;i<q.length;i++) s+=q.charCodeAt(i);
  s+=q.length*13;
  s+=Date.now()%100000;
  s+=Math.floor(Math.random()*9999);
  return (s%78)+1;
}

function saveDiaryEntry(q,c,n){
  const e={question:q,card:c,notes:n,date:new Date().toLocaleString()};
  let d=JSON.parse(localStorage.getItem("tarotDiary")||"[]");
  d.push(e);
  localStorage.setItem("tarotDiary",JSON.stringify(d));
}

function renderDiary(){
  let d=JSON.parse(localStorage.getItem("tarotDiary")||"[]");
  const box=document.getElementById('diary-entries');
  box.innerHTML="";
  d.forEach(e=>{
    const div=document.createElement('div');
    div.className="entry";
    div.innerHTML=`
      <p><strong>Question:</strong> ${e.question}</p>
      <p><strong>Card:</strong> ${e.card}</p>
      <p><strong>Date:</strong> ${e.date}</p>
      <p><strong>Notes:</strong><br>${e.notes}</p>
    `;
    box.appendChild(div);
  });
}

function showCard(q){
  const n=hybridRandom(q);
  lastCard=n;

  const img=new Image();
  img.src=`cards/${n}.png?cb=${Date.now()}`;
  img.onload=()=>{
    document.getElementById('card-area').innerHTML="";
    document.getElementById('card-area').appendChild(img);

    document.getElementById('notes-box').style.display="block";
    document.getElementById('save-notes-btn').style.display="block";
  };
}

document.getElementById('infinity-btn').addEventListener('click',()=>{
  const q=document.getElementById('question-box').value.trim();
  if(q!=="" && q!==lastQuestion){
    lastQuestion=q;
    showCard(q);
  }
});

document.getElementById('save-notes-btn').addEventListener('click',()=>{
  const n=document.getElementById('notes-box').value.trim();
  if(lastQuestion && lastCard){
    saveDiaryEntry(lastQuestion,lastCard,n);
    renderDiary();
    alert("Saved.");
  }
});

document.getElementById('diary-btn').addEventListener('click',()=>{
  renderDiary();
  document.getElementById('diary-panel').style.display="block";
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
});

renderDiary();
</script>

</body>
</html>
