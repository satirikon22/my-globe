
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Declinador de sustantivos en checo – 200 palabras (sg/pl aleatorio)</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    .nivel {
      font-size: 1.3em;
      font-weight: 600;
    }

    #contador p {
      margin: 2px 0;
      font-size: 0.9rem;
    }

    #pregunta {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    #result {
      margin-top: 4px;
      font-size: 0.95rem;
    }

    #result .incorrect {
      color: #ff00a8;
      font-weight: bold;
    }

    #result .correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 5px;
      font-size: 14px;
      width: 50%;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }

    @media (min-width: 700px) {
      .title {
        font-size: 1.4rem;
      }
      #pregunta {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

<div class="title">Declinador de sustantivos en checo – <span class="nivel">200 palabras</span></div>

<div id="contador">
  <p><strong>Preguntas:</strong> 0 | <strong>Aciertos:</strong> 0 | <strong>Porcentaje:</strong> 0%</p>
</div>

<div id="pregunta"></div>

<input id="answer" type="text" placeholder="Escribe la forma correcta…" autocomplete="off">
<button onclick="checkAnswer()">Comprobar</button>
<button onclick="newQuestion()">Siguiente</button>

<div id="result"></div>

<script>
let words = [];
let currentWord = null;
let currentCaseKey = null;
let currentCaseLabel = null;
let currentNumber = null; // sg / pl

let total = 0;
let correct = 0;

let waitingForNext = false;

// Casos disponibles
const cases = [
  { key: "NOM1",  label: "Nominativo (1)" },
  { key: "GEN2",  label: "Genitivo (2)" },
  { key: "DAT3",  label: "Dativo (3)" },
  { key: "AKU4",  label: "Acusativo (4)" },
  { key: "VOK5",  label: "Vocativo (5)" },
  { key: "LOK6",  label: "Locativo (6)" },
  { key: "INST7", label: "Instrumental (7)" }
];

// Carga del JSON unificado
fetch('declinaciones200-all.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    words = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("contador").innerHTML =
    `<p><strong>Preguntas:</strong> ${total} |
     <strong>Aciertos:</strong> ${correct} |
     <strong>Porcentaje:</strong> ${percent}%</p>`;
}

function newQuestion() {
  if (!words.length) return;

  waitingForNext = false;

  currentWord = words[Math.floor(Math.random() * words.length)];

  // Caso aleatorio
  const chosenCase = cases[Math.floor(Math.random() * cases.length)];
  currentCaseKey = chosenCase.key;
  currentCaseLabel = chosenCase.label;

  // Número aleatorio: sg o pl
  currentNumber = Math.random() < 0.5 ? "sg" : "pl";

  // Mostrar sustantivo y caso
  document.getElementById("pregunta").innerHTML =
    `Sustantivo: <em>${currentWord["NOM1 " + currentNumber]}</em><br>
     Caso: <strong>${currentCaseLabel}</strong>`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim().toLowerCase();

  const correctForm = currentWord[currentCaseKey + " " + currentNumber];

  const variants = correctForm
    .split("/")
    .map(v => v.trim().toLowerCase());

  total++;

  if (variants.includes(user)) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correcto</span><br>
       Forma: <strong>${correctForm}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrecto</span><br>
       La forma correcta es: <strong>${correctForm}</strong>`;
  }

  updateCounter();
  waitingForNext = true;
}
</script>

</body>
</html>
