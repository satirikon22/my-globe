<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practica las preguntas de la tarea 1</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    .nivel {
      font-size: 1.3em;
      font-weight: 600;
    }

    #pregunta {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }

    @media (min-width: 700px) {
      .title {
        font-size: 1.4rem;
      }
      #pregunta {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

<div class="title">Practica las preguntas de la tarea 1</div>

<div id="pregunta"></div>

<button onclick="newQuestion()">Siguiente</button>

<script>
let questions = [];
let currentQuestion = null;

// Load questions.json from your GitHub Pages
fetch('https://satirikon22.github.io/my-globe/questions.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    questions = data.questions;
    newQuestion();
  });

function newQuestion() {
  if (!questions.length) return;

  // RANDOM QUESTION
  currentQuestion = questions[Math.floor(Math.random() * questions.length)];

  document.getElementById("pregunta").innerHTML =
    `<em>${currentQuestion}</em>`;
}
</script>

</body>
</html>
