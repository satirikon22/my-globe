<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practice declensions in context</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    #counter p {
      margin: 2px 0;
      font-size: 0.9rem;
    }

    #question {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    #result {
      margin-top: 4px;
      font-size: 0.95rem;
    }

    #result .incorrect {
      color: #ff00a8;
      font-weight: bold;
    }

    #result .correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 5px;
      font-size: 14px;
      width: 50%;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }

    /* Czech keyboard styling */
    #cz-keyboard button {
      font-family: 'Rubik', sans-serif;
      font-size: 17px;
      padding: 5px 9px;
      margin: 2px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
    }
    #cz-keyboard button:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

<div class="title">Practice declensions in context</div>

<div id="counter">
  <p><strong>Questions:</strong> 0 | <strong>Correct:</strong> 0 | <strong>Accuracy:</strong> 0%</p>
</div>

<div id="question"></div>

<input id="answer" type="text" placeholder="Type the correct form…" autocomplete="off">
<button onclick="checkAnswer()">Check</button>
<button onclick="newQuestion()">Next</button>

<!-- Czech keyboard UNDER the buttons -->
<div id="cz-keyboard" style="margin-top:8px;">
  <button onclick="insertLetter('ě')">ě</button>
  <button onclick="insertLetter('š')">š</button>
  <button onclick="insertLetter('č')">č</button>
  <button onclick="insertLetter('ř')">ř</button>
  <button onclick="insertLetter('ž')">ž</button>
  <button onclick="insertLetter('ý')">ý</button>
  <button onclick="insertLetter('ď')">ď</button>
  <button onclick="insertLetter('ť')">ť</button>
  <button onclick="insertLetter('ň')">ň</button>
  <button onclick="insertLetter('ů')">ů</button>
  <button onclick="insertLetter('á')">á</button>
  <button onclick="insertLetter('é')">é</button>
  <button onclick="insertLetter('í')">í</button>
  <button onclick="insertLetter('ó')">ó</button>
  <button onclick="insertLetter('ú')">ú</button>
</div>

<div id="result"></div>

<script>
let words = [];
let currentWord = null;
let currentCase = null;

let total = 0;
let correct = 0;
let waitingForNext = false;

// singular + plural cases
const cases = [
  "NOM1sg", "GEN2sg", "DAT3sg", "AKU4sg", "LOK6sg", "INST7sg",
  "NOM1pl", "GEN2pl", "DAT3pl", "AKU4pl", "LOK6pl", "INST7pl"
];

fetch('declinaciones200-all-frases.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    words = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("counter").innerHTML =
    `<p><strong>Questions:</strong> ${total} |
     <strong>Correct:</strong> ${correct} |
     <strong>Accuracy:</strong> ${percent}%</p>`;
}

function newQuestion() {
  waitingForNext = false;

  currentWord = words[Math.floor(Math.random() * words.length)];
  currentCase = cases[Math.floor(Math.random() * cases.length)];

  const noun = currentWord.id;
  const sentence = currentWord[currentCase + "_sentence"];

  document.getElementById("question").innerHTML =
    `<strong>${noun}</strong><br><br>${sentence}`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim().toLowerCase();

  const raw = currentWord[currentCase].toLowerCase();
  const options = raw.split("/").map(x => x.trim());

  total++;

  if (options.includes(user)) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correct</span><br>
       Form: <strong>${currentWord[currentCase]}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrect</span><br>
       The correct form is: <strong>${currentWord[currentCase]}</strong>`;
  }

  updateCounter();
  waitingForNext = true;
}

/* ⭐ FINAL FIX: case-insensitive check + fallback to #answer */
function insertLetter(letter) {
  let active = document.activeElement;

  if (!active || active.tagName.toLowerCase() !== "input") {
    active = document.getElementById("answer");
  }

  const start = active.selectionStart;
  const end = active.selectionEnd;

  active.value =
    active.value.substring(0, start) +
    letter +
    active.value.substring(end);

  active.focus();
  active.selectionStart = active.selectionEnd = start + letter.length;
}
</script>

</body>
</html>
