<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practica las declinaciones en el contexto</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    #contador p {
      margin: 2px 0;
      font-size: 0.9rem;
    }

    #pregunta {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    #result {
      margin-top: 4px;
      font-size: 0.95rem;
    }

    #result .incorrect {
      color: #ff00a8;
      font-weight: bold;
    }

    #result .correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 5px;
      font-size: 14px;
      width: 50%;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="title">Practica las declinaciones en el contexto</div>

<div id="contador">
  <p><strong>Preguntas:</strong> 0 | <strong>Aciertos:</strong> 0 | <strong>Porcentaje:</strong> 0%</p>
</div>

<div id="pregunta"></div>

<input id="answer" type="text" placeholder="Escribe la forma correcta…" autocomplete="off">
<button onclick="checkAnswer()">Comprobar</button>
<button onclick="newQuestion()">Siguiente</button>

<div id="result"></div>

<script>
let words = [];
let currentWord = null;

let total = 0;
let correct = 0;
let waitingForNext = false;

fetch('declinaciones200-all-frases.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    words = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("contador").innerHTML =
    `<p><strong>Preguntas:</strong> ${total} |
     <strong>Aciertos:</strong> ${correct} |
     <strong>Porcentaje:</strong> ${percent}%</p>`;
}

function newQuestion() {
  waitingForNext = false;

  currentWord = words[Math.floor(Math.random() * words.length)];

  const noun = currentWord.id;
  const sentence = currentWord.NOM1sg_sentence;

  document.getElementById("pregunta").innerHTML =
    `<strong>${noun}</strong><br><br>${sentence}`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim().toLowerCase();
  const correctForm = currentWord.NOM1sg.trim().toLowerCase();

  total++;

  if (user === correctForm) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correcto</span><br>
       Forma: <strong>${currentWord.NOM1sg}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrecto</span><br>
       La forma correcta es: <strong>${currentWord.NOM1sg}</strong>`;
  }

  updateCounter();
  waitingForNext = true;
}
</script>

</body>
</html>
