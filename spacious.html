<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Little Oracle</title>

<!-- Rubik font -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  /* SUPER MOBILE FRIENDLY CARD */
  #card-area img {
    width: 100vw;          /* full width on mobile */
    max-width: 700px;      /* large on desktop */
    display: block;
    margin: 30px auto;
  }

  /* BIG RESPONSIVE TEXT */
  #question-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: 30px auto;
    padding: 20px;
    font-size: clamp(28px, 8vw, 40px);  /* MUCH bigger */
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
  }

  /* BIG RESPONSIVE INFINITY BUTTON */
  #infinity-btn {
    font-size: clamp(70px, 15vw, 120px); /* huge on mobile */
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<script>
// Random card from 1–78
function showRandomCard() {
  const n = Math.floor(Math.random() * 78) + 1;
  const img = new Image();
  img.src = `cards/${n}.png`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);
  };

  img.onerror = () => {
    console.log(`Error loading card ${n}`);
  };
}

// Infinity button triggers the random card
document.getElementById('infinity-btn').addEventListener('click', showRandomCard);
</script>

</body>
</html>
