<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Card Test</title>
<style>
  body {
    background: black;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }

  #card-area img {
    max-width: 300px;
    display: block;
    margin: 20px auto;
  }

  #question-box {
    width: 90%;
    max-width: 400px;
    display: block;
    margin: 20px auto;
    padding: 10px;
    font-size: 18px;
    background: #222;
    color: white;
    border: 1px solid #555;
  }

  #infinity-btn {
    font-size: 40px;
    display: block;
    margin: 10px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<script>
// Random card from 1–78
function showRandomCard() {
  const n = Math.floor(Math.random() * 78) + 1;
  const img = new Image();
  img.src = `cards/${n}.png`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);
  };

  img.onerror = () => {
    console.log(`Error loading card ${n}`);
  };
}

// Infinity button triggers the random card
document.getElementById('infinity-btn').addEventListener('click', showRandomCard);
</script>

</body>
</html>
