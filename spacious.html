<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Oracle</title>

<!-- Rubik font -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    background: black;
    color: white;
    font-family: 'Rubik', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  /* Responsive card */
  #card-area img {
    width: 90vw;          /* fills mobile screen */
    max-width: 500px;     /* desktop size */
    display: block;
    margin: 30px auto;
  }

  /* Responsive text input */
  #question-box {
    width: 90%;
    max-width: 500px;
    display: block;
    margin: 30px auto;
    padding: 15px;
    font-size: clamp(20px, 5vw, 28px);  /* responsive text */
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
  }

  /* Responsive infinity button */
  #infinity-btn {
    font-size: clamp(50px, 10vw, 80px); /* scales on mobile */
    display: block;
    margin: 20px auto;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
    padding: 10px;
  }
</style>
</head>

<body>

<input id="question-box" type="text" placeholder="Write your question here">
<button id="infinity-btn">∞</button>

<div id="card-area"></div>

<script>
// Random card from 1–78
function showRandomCard() {
  const n = Math.floor(Math.random() * 78) + 1;
  const img = new Image();
  img.src = `cards/${n}.png`;

  img.onload = () => {
    const area = document.getElementById('card-area');
    area.innerHTML = '';
    area.appendChild(img);
  };

  img.onerror = () => {
    console.log(`Error loading card ${n}`);
  };
}

// Infinity button triggers the random card
document.getElementById('infinity-btn').addEventListener('click', showRandomCard);
</script>

</body>
</html>
