<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practice declensions in context</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      margin: 0;
      line-height: 1.1;
      font-size: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 6px 0;
    }

    #counter p {
      margin: 2px 0;
      font-size: 0.9rem;
    }

    #question {
      margin: 5px 0 7px 0;
      font-size: 1.1rem;
    }

    #result {
      margin-top: 4px;
      font-size: 0.95rem;
    }

    #result .incorrect {
      color: #ff00a8;
      font-weight: bold;
    }

    #result .correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 5px;
      font-size: 14px;
      width: 50%;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 4px 6px;
      margin: 3px 3px 0 0;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="title">Practice declensions in context</div>

<div id="counter">
  <p><strong>Questions:</strong> 0 | <strong>Correct:</strong> 0 | <strong>Accuracy:</strong> 0%</p>
</div>

<div id="question"></div>

<input id="answer" type="text" placeholder="Type the correct form…" autocomplete="off">
<button onclick="checkAnswer()">Check</button>
<button onclick="newQuestion()">Next</button>

<div id="result"></div>

<script>
let words = [];
let currentWord = null;
let currentCase = null;

let total = 0;
let correct = 0;
let waitingForNext = false;

// 6 cases (sg only)
const cases = [
  "NOM1sg",
  "GEN2sg",
  "DAT3sg",
  "AKU4sg",
  "LOK6sg",
  "INST7sg"
];

fetch('declinaciones200-all-frases.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    words = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("counter").innerHTML =
    `<p><strong>Questions:</strong> ${total} |
     <strong>Correct:</strong> ${correct} |
     <strong>Accuracy:</strong> ${percent}%</p>`;
}

function newQuestion() {
  waitingForNext = false;

  currentWord = words[Math.floor(Math.random() * words.length)];
  currentCase = cases[Math.floor(Math.random() * cases.length)];

  const noun = currentWord.id;
  const sentence = currentWord[currentCase + "_sentence"];

  document.getElementById("question").innerHTML =
    `<strong>${noun}</strong><br><br>${sentence}`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim().toLowerCase();
  const correctForm = currentWord[currentCase].trim().toLowerCase();

  total++;

  if (user === correctForm) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correct</span><br>
       Form: <strong>${currentWord[currentCase]}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrect</span><br>
       The correct form is: <strong>${currentWord[currentCase]}</strong>`;
  }

  updateCounter();
  waitingForNext = true;
}
</script>

</body>
</html>
