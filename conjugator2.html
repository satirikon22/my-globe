<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conjugador de verbos en checo – presente</title>
</head>
<body>

<h1>Conjugador de verbos en checo – presente</h1>

<div id="pregunta"></div>

<input id="respuesta" type="text" placeholder="Escribe la forma correcta…" autocomplete="off">
<button onclick="comprobar()">Comprobar</button>

<div id="resultado"></div>

<script>
let verbos = [];
let verboActual = null;
let personaActual = null;

const personas = [
  "já",
  "ty",
  "on, ona, ono, to",
  "my",
  "vy",
  "oni, ony"
];

fetch('verbs2.json?nocache=' + Date.now())
  .then(r => r.json())
  .then(data => {
    verbos = data;
    nuevaPregunta();
  });

function nuevaPregunta() {
  verboActual = verbos[Math.floor(Math.random() * verbos.length)];
  personaActual = personas[Math.floor(Math.random() * personas.length)];

  document.getElementById("pregunta").innerHTML =
    `<h2>Verbo: <em>${verboActual.Infinitiv}</em></h2>
     <p>Persona: <strong>${personaActual}</strong></p>`;

  document.getElementById("resultado").innerHTML = "";

  const input = document.getElementById("respuesta");
  input.value = "";
  input.focus();
}

function comprobar() {
  const usuario = document.getElementById("respuesta").value.trim();
  const correcto = verboActual[personaActual];

  if (usuario === correcto) {
    document.getElementById("resultado").innerHTML =
      `<span style="color: green; font-weight: bold;">¡Correcto!</span>`;
  } else {
    document.getElementById("resultado").innerHTML =
      `<span style="color: red; font-weight: bold;">Incorrecto.</span><br>
       La forma correcta es: <strong>${correcto}</strong>`;
  }

  setTimeout(nuevaPregunta, 1500);
}
</script>

</body>
</html>
