<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conjugador de verbos en checo - presente</title>

  <!-- Rubik font -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    #result span.incorrect {
      color: #ff00a8; /* NEW pink */
      font-weight: bold;
    }

    #result span.correct {
      color: green;
      font-weight: bold;
    }

    input {
      font-family: 'Rubik', sans-serif;
      padding: 6px;
      font-size: 16px;
    }

    button {
      font-family: 'Rubik', sans-serif;
      padding: 6px 12px;
      margin-left: 4px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Conjugador de verbos en checo - presente</h1>

<!-- Counter -->
<div id="contador">
  <p><strong>Preguntas:</strong> 0 | <strong>Aciertos:</strong> 0 | <strong>Porcentaje:</strong> 0%</p>
</div>

<!-- Question -->
<div id="pregunta"></div>

<!-- Input + Buttons -->
<input id="answer" type="text" placeholder="Escribe la forma correcta…" autocomplete="off">
<button onclick="checkAnswer()">Comprobar</button>
<button onclick="newQuestion()">Siguiente</button>

<!-- Result -->
<div id="result"></div>

<script>
let verbs = [];
let currentVerb = null;
let currentPerson = null;

let total = 0;
let correct = 0;

let waitingForNext = false;

const persons = [
  "já",
  "ty",
  "on, ona, ono, to",
  "my",
  "vy",
  "oni, ony"
];

// Load JSON
fetch('verbs2.json?nocache=' + Date.now())
  .then(response => response.json())
  .then(data => {
    verbs = data;
    updateCounter();
    newQuestion();
  });

function updateCounter() {
  const percent = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
  document.getElementById("contador").innerHTML =
    `<p><strong>Preguntas:</strong> ${total} | 
     <strong>Aciertos:</strong> ${correct} | 
     <strong>Porcentaje:</strong> ${percent}%</p>`;
}

function newQuestion() {
  if (!verbs.length) return;

  waitingForNext = false;

  currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
  currentPerson = persons[Math.floor(Math.random() * persons.length)];

  document.getElementById("pregunta").innerHTML =
    `<h2>Verbo: <em>${currentVerb.Infinitiv}</em></h2>
     <p>Persona: <strong>${currentPerson}</strong></p>`;

  document.getElementById("result").innerHTML = "";

  const input = document.getElementById("answer");
  input.value = "";
  input.focus();
}

function checkAnswer() {
  if (waitingForNext) return;

  const user = document.getElementById("answer").value.trim();
  const correctForm = currentVerb[currentPerson];

  total++;

  // Case-insensitive comparison
  if (user.toLowerCase() === correctForm.toLowerCase()) {
    correct++;
    document.getElementById("result").innerHTML =
      `<span class="correct">Correcto</span><br>
       Forma: <strong>${correctForm}</strong>`;
  } else {
    document.getElementById("result").innerHTML =
      `<span class="incorrect">Incorrecto</span><br>
       La forma correcta es: <strong>${correctForm}</strong>`;
  }

  updateCounter();

  waitingForNext = true;
}
</script>

</body>
</html>
